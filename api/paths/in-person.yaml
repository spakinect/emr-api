post:
  summary: Create a new in-person visit
  description: >
    Creates a new in-person visit for a patient. If a matching patient is found
    by name and date of birth, their record is used; otherwise, a new patient
    record is created.
    Optionally, EMR systems can submit intake answers when creating the visit;
    these are pre-filled for the patient when they open the intake form.
  operationId: createInPersonVisit
  tags:
    - InPerson
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../emr-openapi.yaml#/components/schemas/InPersonVisitCreationRequest"
        examples:
          standard_visit:
            summary: Standard in-person visit creation
            value:
              patient_details:
                first_name: John
                last_name: Doe
                dob: "10/27/1990"
              location_id: loc_12345
              requested_treatments:
                - Botox Injection
                - Dermal Filler
          with_intake_answers:
            summary: In-person visit with EMR-submitted intake answers
            value:
              patient_details:
                first_name: Jane
                last_name: Smith
                dob: "05/14/1985"
              location_id: loc_12345
              requested_treatments:
                - Botox Injection
              intake_answers:
                - question: pregnant-breastfeeding-ivf
                  answer: No
                - question: allergies
                  answer:
                    selected: yes
                    items:
                      - Penicillin
                - question: medical-conditions
                  answer:
                    selected: no
                    items: []
                - question: medications
                  answer:
                    selected: yes
                    items:
                      - Aspirin
                      - Vitamin D
  responses:
    "201":
      description: In-person visit created successfully.
      content:
        application/json:
          schema:
            $ref: "../emr-openapi.yaml#/components/schemas/InPersonVisitCreationResponse"
          examples:
            success:
              summary: Successful in-person visit creation
              value:
                success: true
                visit_id: gfe_abc123xyz789
                visit_link: https://client.spakinect.com/visit/gfe_abc123xyz789
    "400":
      $ref: "../emr-openapi.yaml#/components/responses/BadRequest"
    "401":
      $ref: "../emr-openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../emr-openapi.yaml#/components/responses/Forbidden"
    "404":
      $ref: "../emr-openapi.yaml#/components/responses/NotFound"
    "500":
      $ref: "../emr-openapi.yaml#/components/responses/InternalServerError"
